<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 230" role="img" aria-label="A cat mid-squat, knees out, seen from behind">
  <g stroke="#3a2f28" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- tail: up and curled behind the right haunch, fully engaged core -->
    <path d="M196 118 C222 102 226 76 212 60 C202 50 190 56 194 68" fill="none"/>
    <!-- torso leaning into the rep -->
    <path d="M120 58 C94 58 92 92 98 110 L142 110 C148 92 146 58 120 58 Z" fill="#f9ecd7"/>
    <!-- haunches: knees OUT -->
    <circle cx="82" cy="148" r="54" fill="#f6b78f"/>
    <circle cx="158" cy="148" r="54" fill="#f6b78f"/>
    <path d="M120 108 L120 192" fill="none"/>
    <!-- bent legs planted wide -->
    <path d="M42 176 C28 186 24 198 30 206" fill="none"/>
    <path d="M198 176 C212 186 216 198 210 206" fill="none"/>
    <ellipse cx="42" cy="210" rx="17" ry="8" fill="#f9ecd7"/>
    <ellipse cx="198" cy="210" rx="17" ry="8" fill="#f9ecd7"/>
    <!-- head + ears, with a workout sweatband -->
    <circle cx="120" cy="44" r="27" fill="#f9ecd7"/>
    <path d="M102 26 L96 6 L115 17 Z" fill="#f9ecd7"/>
    <path d="M138 26 L144 6 L125 17 Z" fill="#f9ecd7"/>
    <path d="M96 34 C104 28 136 28 144 34 L144 44 C136 38 104 38 96 44 Z" fill="#52688f"/>
  </g>
  <!-- effort lines: she is WORKING -->
  <g stroke="#3a2f28" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <path d="M18 128 L30 134" fill="none"/>
    <path d="M14 148 L28 150" fill="none"/>
    <path d="M222 128 L210 134" fill="none"/>
    <path d="M226 148 L212 150" fill="none"/>
  </g>
  <!-- sweat drop -->
  <path d="M158 20 C158 26 154 29 158 33 C162 29 158 26 158 20 Z" fill="#8fa3c8" stroke="#52688f" stroke-width="3" stroke-linejoin="round"/>
  <!-- blush -->
  <ellipse cx="52" cy="142" rx="11" ry="6" fill="#e0704f" opacity="0.55"/>
  <ellipse cx="188" cy="142" rx="11" ry="6" fill="#e0704f" opacity="0.55"/>
</svg>
