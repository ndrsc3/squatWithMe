name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Runtime-load gate: actually import every api/* function under Node ESM.
      # The four checks above stayed green while every route 500'd in production —
      # none of them loads a function under the runtime that serves it.
      - run: npm run smoke
